[project]
name = "arctic-showcase"
version = "0.1.0"
description = "Showcase for using Prescient for arctic data management and analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.5",
    "geopandas>=1.1.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pytest>=9.0.3",
    "rasterio>=1.5.0",
    "shapely>=2.1.2",
    "tqdm>=4.67.3",
    "xarray>=2026.4.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/*"]

[dependency-groups]
dev = []
