[project]
name = "arctic-showcase"
version = "0.1.0"
description = "Showcase for using Prescient for arctic data management and analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.34",
    "einops>=0.7.0",
    "geopandas>=1.1.3",
    "matplotlib>=3.10.9",
    "netcdf4>=1.7.4",
    "numpy>=2.4.6",
    "pandas>=3.0.2",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "torch>=2.12.1",
    "tqdm>=4.67.3",
    "utils>=1.0.2",
    "xarray>=2026.4.0",
    "rioxarray>=0.22.0",
    "requests>=2.34.2",
    "mypy-boto3-s3>=1.43.31",
    "claymodel",
    "tensorflow>=2.21.0",
    "pyproj>=3.7.2",
    "pyarrow>=25.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training/src/training"]

[tool.uv.workspace]
members = ["src/*"]
exclude = ["src/training"]

[tool.uv.sources]
claymodel = { git = "https://github.com/Clay-foundation/model.git" }

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.30",
    "ipykernel>=6",
    "ipywidgets>=8.1.8",
    "mypy>=1.10",
    "pytest>=9.0.3",
    "ruff>=0.4",
    "unet>=0.8.1",
    "scikit-learn>=1.9.0",
    "leafmap>=0.62.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
