[project]
name = "arctic-showcase"
version = "0.1.0"
description = "Showcase for using Prescient for arctic data management and analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.5",
    "geopandas>=1.1.3",
    "leafmap>=0.62.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "rasterio>=1.5.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
    "unet>=0.8.1",
    "utils>=1.0.2",
    "xarray>=2026.4.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/*"]

[dependency-groups]
dev = [
    "ipykernel>=6",
    "mypy>=1.10",
    "pytest>=9.0.3",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
